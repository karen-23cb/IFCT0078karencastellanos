<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1{
            font-family: 'Courier New', Courier, monospace;
            font-size: 42px;
        }
        .rojo{
            color:red
        }
        .negrita{
            font-weight: bold;
        }
        .centrado{
            text-align: center;
        }
        #primero{
            text-decoration: underline;
        }


        a,{
            font-family: Arial, Helvetica, sans-serif;
            text-decoration: overline;
            size: 32px;
        }
        article p{
            text-decoration: none;
            background-color: green;
            color: yellow ;

        }




    </style>
    <title>Selectores</title>
</head>
<body>
    <h1 class="rojo">Hola mundo</h1>
    <h1>Segundo titular</h1>

    <header>
        <p class="negrita rojo centrado">
            karen
        </p>
    </header>

    <h2 id="primero">
        Este es un H2
    </h2>
    <a href="">Este es un enlace</a>

    <article>
        <p>
            texto x <a href="">enlace lejano</a>
        </p>
    </article>

</body>
</html>
