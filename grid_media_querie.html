<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid y media querie</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(174, 187, 151);
            padding: 20px;

        }

        .contenedor{
            display: grid;
            grid-template-columns: 250px 1fr;



            grid-template-areas: 
            "header header"
            "menu content"
            "ads content"
            "footer footer";

            gap: 20px;
            max-width: 1200px;
            margin: auto

        }

        .header{
            grid-area: header;
            background-color: rgb(78, 141, 80);

        }

        .menu{
            grid-area: menu;
            background-color: rgb(8, 160, 16);

        }

        .content{
            grid-area: content;
            background-color: rgb(21, 248, 40);

        }

        .ads{
            grid-area: ads;
            background-color: rgb(44, 99, 7);
        }

        .footer{
            grid-area: footer;
            background-color: rgb(42, 165, 97);
        }
        .box{
            color: white;
            padding: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
        }
    </style>


</head>

<body>
    <div class="contenedor">

        <header class="header box">HEADER</header>
        <nav class="menu box">MENU</nav>
        <main class=" content box">CONTENIDO</main>
        <aside class="ads box">PUBLICIDAD</aside>
        <footer class="footer box">PIE</footer>

    </div>



    
</body>
</html>
