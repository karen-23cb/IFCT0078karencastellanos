            border: 1px solid rgb(0, 0, 0);
            background-color: rgb(224, 170, 19);
            border-radius: 6px; background-size: cover;
            background-position: center;
            overflow: hidden;

        }

            grid-area: ;

</head>

        <div class="elem-5"></div>
        <div class="elem-6"></div>

</html>
