<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Original: https://jamstackthemes.dev/demo/theme/chulapa/ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            height: 100vh;
            width: 100vw;
            background-image: url("Imagenes_2/foto_metro.jpg");
            background-position: right;
            background-size: cover;
            overflow: hidden;

        }

        h1 {
            font-size: 6rem;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: white;
        }

        p {
            color: white;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            margin-top: 30px;
            margin-bottom: 60px;
        }


        /* Estilos de clase */
        .fondo-gris {
            height: 100%;
            background-color: rgba(140, 139, 139, 0.343);
        }


        .separador {
            width: 12%;
            /* Ancho deseado */
            margin: 15px auto;
            /* 20px arriba/abajo, auto centra horizontalmente */
            border: 0;
            /* Elimina el borde por defecto del navegador */
            border-top: 4px solid #ffffff;
            /* Define el grosor y color */

        }

        .contenedor {
            width: 70vw;
            margin: 0 auto;
            text-align: center;
            padding: 300px;
        }

        .sombra {
            text-shadow: 1px 2px 2px black;

        }

        .pastilla {
            margin: 2rem auto;
            color: rgb(255, 255, 255);
            border: 1px solid white;
            padding: 20px;
            width: fit-content;
            border-radius: 10px;

        }

        .pastilla a {
            font-size: 2rem;
            text-decoration: none;
            color: white;

        }

        .fondo-azul {
            background-color: rgb(3, 3, 85);
        }

        .primer-subtitulo {}
    </style>
    <title>Chulapa</title>
</head>

<body>
    <header>
        <div class="fondo-gris">
            <div class="contenedor">
                <h1 class="sombra">CHULAPA</h1>
                <hr class="separador">
                <p class="sombra">A full flexible Jekyll theme for Github Pages</p>

                <div class="pastilla">
                    <a href="">
                        <i class="fa-brands fa-github"></i>Follow
                    </a>
                </div>

            </div>

        </div>

    </header>
    <main>
        <div class="fondo-azul">
            <div class="contenedor">
                <p class="primer-subtitulo">Latest release</p>

 

            </div>

        </div>

    </main>
</body>

</html>
