<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de diseño fluido</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: sans-serif;

        }
        .hero-section{
            width: 100vw;
            height: 70vh;
            background-color: rgb(82, 179, 82);
            color: white;
            text-align: center;
            margin-bottom: 20px;   



        }
        .hero-tittle{
            font-size: 8vw;
            margin: 0;
            

        }
    </style>
</head>

<body>
<div class="hero-section">
    <h1 class="hero-title">Diseño fluido con vw y vh</h1>


</div>
<p class="fluido">
    Este es un texto que se adapta dinamicamente al tamaño de la ventana. <br>
    Cambia el tamaño de la ventana y a ver que pasa.
</p> 

</body>

</html>
