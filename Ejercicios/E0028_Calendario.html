<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        .contenedor {

            background-color: rgb(209, 196, 183);
            color: rgb(43, 24, 14);
            width: 900px;
            border: 6px double rgb(126, 127, 131);
            margin: 0 auto;
            padding: 20px;

        }

        .subtitulo {
            padding-bottom: 0.5rem;
            font-family: cursive;
            font-style: italic;
            
        }


       header{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid rgb(14, 13, 13);
            padding-bottom: 2rem;

        }

        .semana{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            text-align: center;
            border-bottom: 2px solid rgb(14, 13, 13);
            margin-top: 20px;
            padding-bottom: 1rem;


        }
        .mes{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            grid-auto-rows: 100px;
            gap: 6px;
        }


        .dia{
            border:1px solid rgb(14, 13, 13) ;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 1rem;
        }
        .dia:hover{
         background-color: rgb(214, 236, 11);
         color: white;
        }
        .domingo{
            border:1px solid rgb(14, 13, 13) ;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background-color: rgba(255, 60, 0, 0.774);
            color: white;
            border-radius: 1rem;

        }
        .domingo:hover{
         background-color: black;
         color: white;
        }

        footer{
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid rgb(14, 13, 13);
            padding-bottom:rem;
            


        }

        footer p{
            font-size: 1.5rem;
            color: rgb(36, 19, 8);
        }


        


    </style>


</head>

<body>

    <div class="contenedor">
        <header class="hero">
            <h1>Octubre 1897</h1>
            <p class="subtitulo">Registro de observaciones del viajero</p>

        </header>


        <div class="semana">

            <div>Lun</div>
            <div>Mar</div>
            <div>Mie</div>
            <div>Jue</div>
            <div>Vie</div>
            <div>Sab</div>
            <div>Dom</div>
        </div>


        <hr>


        <div  class="mes">



            <div ></div>
            <div class="dia">1</div>
            <div class="dia">2</div>
            <div class="dia">3</div>
            <div class="dia">4</div>
            <div class="dia">5</div>
            <div class="domingo">6</div>

            <div class="dia">7</div>
            <div class="dia">8</div>
            <div class="dia">9</div>
            <div class="dia">10</div>
            <div class="dia">11</div>
            <div class="dia">12</div>
            <div class="domingo">13</div>

            <div class="dia">14</div>
            <div class="dia">15</div>
            <div class="dia">16</div>
            <div class="dia">17</div>
            <div class="dia">18</div>
            <div class="dia">19</div>
            <div class="domingo">20</div>

            <div class="dia">21</div>
            <div class="dia">22</div>
            <div class="dia">23</div>
            <div class="dia">24</div>
            <div class="dia">25</div>
            <div class="dia">26</div>
            <div class="domingo">27</div>

            <div class="dia">28</div>
            <div class="dia">29</div>
            <div class="dia">30</div>
            <div class="dia">31</div>
            <div></div>
            <div></div>
            <div></div>

        </div>
        <hr>

        <footer>
            <P>"El tiempo se escribe a mano en los margenes del mundo"</P>
        </footer>
    </div>
</body>

</html>
