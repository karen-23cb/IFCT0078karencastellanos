<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento</title>

    <style>
        .padre {
            width: 500px;
            height: 500px;
            border: 2px solid blueviolet;
            position: relative;

        }

        .hijo {
            width: 200px;
            height: 200px;
            border: 2px solid rgb(43, 122, 226);
            position: absolute;
            top: 300px;
        }

        .sobrino{
            background-color: blueviolet;
            height: 100px;
            width: 100px;

        }

    </style>

</head>


<body>
    <div class="padre">
        <div class="hijo">

        </div>
        <div class="sobrino">

        </div>
    </div>
</body>

</html>
